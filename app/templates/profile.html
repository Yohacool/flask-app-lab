{% extends "base.html" %}
{% block content %}
<body class="{{ theme }}">
<h2>Вітаю, {{ user }}!</h2>

<a href="{{ url_for('set_theme', color='light') }}">Світла тема</a>
<a href="{{ url_for('set_theme', color='dark') }}">Темна тема</a>

<h3>Кукі користувача</h3>
<table class="table card">
    <thead>
        <tr>
            <th class="key">Ключ</th>
            <th class="value">Значення</th>
            <th class="actions">Дія</th>
        </tr>
    </thead>
    <tbody>
        {% for key, val in cookies %}
        <tr>
            <td class="key">{{ key }}</td>
            <td class="value"><span class="cookie-value" title="{{ val }}"></span>{{ val }}</span></td>
            <td class="actions"><a class="btn-link" href="{{ url_for('delete_cookie', key=key) }}">Видалити</a></td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<form method="POST" action="{{ url_for('add_cookie') }}">
  <h4>Додати кукі</h4>
  <input type="text" name="key" placeholder="Ключ">
  <input type="text" name="value" placeholder="Значення">
  <button type="submit">Додати</button>
</form>

<a href="{{ url_for('delete_all_cookies') }}">Видалити всі кукі</a>
</body>
{% endblock %}
